<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blockcraft - Single / Multi</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Consolas, monospace}
  body{background:#000;overflow:hidden;color:#fff}
  #game{width:100vw;height:100vh;display:block}
  #ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
  .panel{pointer-events:auto;background:rgba(0,0,0,0.8);border:2px solid #555;padding:12px;border-radius:8px}
  #topBar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
  #healthBar{width:200px;height:20px;background:#333;border:2px solid #fff;display:flex}
  #healthFill{width:100%;height:100%;background:linear-gradient(90deg,#ff0000,#00ff00);transition:width 0.2s}
  #hotbar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
  .slot{width:48px;height:48px;background:rgba(0,0,0,0.6);border:2px solid #666;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer}
  .slot.active{border-color:#fff;background:rgba(255,255,255,0.2);transform:scale(1.1)}
  button{pointer-events:auto;padding:8px 12px;background:#4CAF50;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:bold}
  button:hover{background:#45a049}
  button.red{background:#f44336} button.red:hover{background:#d32f2f}
  button.blue{background:#2196F3}
  #menu{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;min-width:320px}
  input{pointer-events:auto;padding:8px;width:100%;margin:5px 0;background:#222;color:#fff;border:1px solid #555;border-radius:4px}
  #crosshair{position:absolute;top:50%;left:50%;width:20px;height:20px;transform:translate(-50%,-50%);pointer-events:none}
  #crosshair::before,#crosshair::after{content:'';position:absolute;background:#fff}
  #crosshair::before{width:2px;height:20px;left:9px} #crosshair::after{width:20px;height:2px;top:9px}
  #controlsInfo{position:absolute;bottom:80px;left:10px;font-size:11px;line-height:1.4;background:rgba(0,0,0,0.6);padding:8px;border-radius:4px}
</style>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="crosshair"></div>
<div id="ui">
  <div id="topBar">
    <div class="panel" style="display:flex;gap:10px;align-items:center">
      <div>VIDA:</div>
      <div id="healthBar"><div id="healthFill"></div></div>
      <span id="healthText">100</span>
    </div>
    <div class="panel" style="display:flex;gap:8px">
      <button id="pvpBtn" class="red">PvP: ON</button>
      <button id="invBtn" class="blue">INV [E]</button>
      <button id="menuBtn">MENU [ESC]</button>
    </div>
  </div>
  <div id="hotbar"></div>
  <div id="controlsInfo">
    <b>PC - TODAS TECLAS:</b><br>
    WASD=Mover | MOUSE=Mirar/Clicar<br>
    ESPAÇO=Pular | SHIFT=Correr | CTRL=Agachar<br>
    CLICK ESQ=Quebrar | CLICK DIR=Colocar | R=Atacar<br>
    1-9=Hotbar | E=Inventário | Q=Largar | ESC=Menu<br>
    F=Voar | L=Travar mouse
  </div>
  <div id="menu" class="panel">
    <h2>BLOCKCRAFT</h2>
    <button id="singleBtn" style="width:100%;margin:5px 0;padding:12px">SINGLEPLAYER</button>
    <hr style="margin:10px 0">
    <button id="hostBtn" style="width:100%;background:#FF9800">HOSTEAR MULTIPLAYER</button>
    <div style="margin:8px 0">Seu ID: <b id="myId">gerando...</b> <button id="copyIdBtn" style="padding:2px 8px">COPIAR</button></div>
    <input id="friendId" placeholder="ID do amigo (só colar)">
    <button id="joinBtn" style="width:100%">ENTRAR NO MUNDO DO AMIGO</button>
    <p style="font-size:11px;margin-top:10px;color:#aaa">Link fácil: tinyurl.com/33e73amr</p>
    <p id="status" style="font-size:12px;margin-top:8px;color:#0f0"></p>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87CEEB);scene.fog=new THREE.Fog(0x87CEEB,50,200);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('game'),antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
scene.add(new THREE.AmbientLight(0xffffff,0.6));
const sun=new THREE.DirectionalLight(0xffffff,0.8);sun.position.set(100,200,100);sun.castShadow=true;scene.add(sun);
const blocks=new Map();
const blockTypes=[{name:'Grama',color:0x5da736},{name:'Terra',color:0x8B4513},{name:'Pedra',color:0x888888},{name:'Madeira',color:0x9c6b3f},{name:'Folha',color:0x228B22},{name:'Areia',color:0xD2B48C},{name:'Vidro',color:0xADD8E6,trans:true},{name:'Tijolo',color:0xB22222},{name:'Ouro',color:0xFFD700}];
let selectedSlot=0;let health=100;let pvpOn=true;let flying=false;
const player={x:0,y:10,z:0,vx:0,vy:0,vz:0,onGround:false};
function keyBlock(x,y,z){return `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`}
function addBlock(x,y,z,typeIdx=0){
  const k=keyBlock(x,y,z);if(blocks.has(k))return;
  const geo=new THREE.BoxGeometry(1,1,1);
  const mat=new THREE.MeshLambertMaterial({color:blockTypes[typeIdx].color,transparent:!!blockTypes[typeIdx].trans,opacity:blockTypes[typeIdx].trans?0.5:1});
  const m=new THREE.Mesh(geo,mat);m.position.set(Math.floor(x)+0.5,Math.floor(y)+0.5,Math.floor(z)+0.5);m.castShadow=true;m.receiveShadow=true;m.userData={type:typeIdx};scene.add(m);blocks.set(k,m);
}
function removeBlock(x,y,z){const k=keyBlock(x,y,z);const m=blocks.get(k);if(m){scene.remove(m);blocks.delete(k);}}
for(let x=-20;x<=20;x++)for(let z=-20;z<=20;z++){addBlock(x,0,z,0);if(Math.random()<0.02){for(let y=1;y<4;y++)addBlock(x,y,z,3);for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++)for(let dz=-2;dz<=2;dz++)if(Math.abs(dx)+Math.abs(dy)+Math.abs(dz)<4)addBlock(x+dx,5+dy,z+dz,4);}}
const keys={};let mouseDown={left:false,right:false};let yaw=0,pitch=0;let locked=false;
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Digit')){selectedSlot=parseInt(e.code[5])-1;updateHotbar();}if(e.code==='KeyF')flying=!flying;if(e.code==='KeyR')attack();});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*0.002;pitch-=e.movementY*0.002;pitch=Math.max(-1.5,Math.min(1.5,pitch));});
renderer.domElement.addEventListener('click',()=>{if(!locked)renderer.domElement.requestPointerLock();});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;});
renderer.domElement.addEventListener('mousedown',e=>{if(e.button===0)mouseDown.left=true;if(e.button===2)mouseDown.right=true;e.preventDefault();});
renderer.domElement.addEventListener('mouseup',e=>{if(e.button===0)mouseDown.left=false;if(e.button===2)mouseDown.right=false;});
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
const raycaster=new THREE.Raycaster();
function doBlockAction(){
  raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
  const hits=raycaster.intersectObjects([...blocks.values()]);
  if(hits.length>0&&hits[0].distance<6){
    const hit=hits[0];
    if(mouseDown.left){removeBlock(hit.object.position.x-0.5,hit.object.position.y-0.5,hit.object.position.z-0.5);mouseDown.left=false;}
    if(mouseDown.right){const n=hit.face.normal;addBlock(hit.object.position.x-0.5+n.x,hit.object.position.y-0.5+n.y,hit.object.position.z-0.5+n.z,selectedSlot);mouseDown.right=false;}
  }
}
function updatePlayer(dt){
  const speed=keys['ShiftLeft']?0.15:0.08;
  const forward=new THREE.Vector3();camera.getWorldDirection(forward);forward.y=0;forward.normalize();
  const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).negate();
  if(keys['KeyW']){player.x+=forward.x*speed*dt*60;player.z+=forward.z*speed*dt*60;}
  if(keys['KeyS']){player.x-=forward.x*speed*dt*60;player.z-=forward.z*speed*dt*60;}
  if(keys['KeyA']){player.x-=right.x*speed*dt*60;player.z-=right.z*speed*dt*60;}
  if(keys['KeyD']){player.x+=right.x*speed*dt*60;player.z+=right.z*speed*dt*60;}
  if(flying){if(keys['Space'])player.y+=0.15*dt*60;if(keys['ControlLeft'])player.y-=0.15*dt*60;}
  else{player.vy-=0.02*dt*60;player.y+=player.vy*dt*60;if(blocks.has(keyBlock(player.x,player.y-0.8,player.z))){player.y=Math.floor(player.y)+1;player.vy=0;player.onGround=true;if(keys['Space']){player.vy=0.35;player.onGround=false;}}else player.onGround=false;}
  camera.position.set(player.x,player.y+0.6,player.z);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
}
function attack(){if(!pvpOn)return;if(conn&&conn.open){conn.send({type:'damage',amount:10});}statusEl.textContent='ATACOU!';setTimeout(()=>statusEl.textContent='',1000);}
function takeDamage(v){health=Math.max(0,health-v);document.getElementById('healthFill').style.width=health+'%';document.getElementById('healthText').textContent=health;if(health<=0){health=100;player.x=0;player.y=20;player.z=0;alert('Morreu! Respawn');}}
function updateHotbar(){const hb=document.getElementById('hotbar');hb.innerHTML='';blockTypes.forEach((b,i)=>{const d=document.createElement('div');d.className='slot'+(i===selectedSlot?' active':'');d.textContent=b.name;d.onclick=()=>{selectedSlot=i;updateHotbar();};hb.appendChild(d);});}
updateHotbar();
let peer=null,conn=null;const statusEl=document.getElementById('status');const myIdEl=document.getElementById('myId');
function initPeer(){peer=new Peer(Math.random().toString(36).substring(2,8));peer.on('open',id=>myIdEl.textContent=id);peer.on('connection',c=>{conn=c;setupConn();statusEl.textContent='Amigo conectou!';document.getElementById('menu').style.display='none';});}
function setupConn(){conn.on('data',data=>{if(data.type==='blockAdd')addBlock(data.x,data.y,data.z,data.t);if(data.type==='blockRem')removeBlock(data.x,data.y,data.z);if(data.type==='damage'&&pvpOn)takeDamage(data.amount);});}
initPeer();
document.getElementById('singleBtn').onclick=()=>{document.getElementById('menu').style.display='none';renderer.domElement.requestPointerLock();};
document.getElementById('hostBtn').onclick=()=>{document.getElementById('menu').style.display='none';renderer.domElement.requestPointerLock();statusEl.textContent='Hosteando! ID: '+myIdEl.textContent;};
document.getElementById('joinBtn').onclick=()=>{const fid=document.getElementById('friendId').value.trim();if(!fid)return alert('Cola o ID');conn=peer.connect(fid);conn.on('open',()=>{setupConn();statusEl.textContent='Conectado!';document.getElementById('menu').style.display='none';renderer.domElement.requestPointerLock();});};
document.getElementById('copyIdBtn').onclick=()=>{navigator.clipboard.writeText(myIdEl.textContent);statusEl.textContent='ID copiado!';};
document.getElementById('pvpBtn').onclick=(e)=>{pvpOn=!pvpOn;e.target.textContent='PvP: '+(pvpOn?'ON':'OFF');e.target.className=pvpOn?'red':'';};
document.getElementById('menuBtn').onclick=()=>document.getElementById('menu').style.display='block';
const _add=addBlock;addBlock=(x,y,z,t)=>{_add(x,y,z,t);if(conn&&conn.open)conn.send({type:'blockAdd',x,y,z,t});};
const _rem=removeBlock;removeBlock=(x,y,z)=>{_rem(x,y,z);if(conn&&conn.open)conn.send({type:'blockRem',x,y,z});};
let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min(0.05,(now-last)/1000);last=now;updatePlayer(dt);doBlockAction();renderer.render(scene,camera);}loop(performance.now());
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
